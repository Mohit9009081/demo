<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">
        <!-- Header -->

        <div class="form-header">

            <h1>Student Registration</h1>

            <p>
                Please fill in your information to register
            </p>
<div> this checking for git status command</div>
        </div>


        <!-- Form -->

        <form>

            <!-- Personal Information -->

            <div class="section">

                <h2 class="section-title">
                    👤 Personal Information
                </h2>

                <div class="form-grid">

                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                            <span class="required">*</span>
                        </label>

                        <input type="text" id="name" name="name" placeholder="Enter your full name">

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                            <span class="required">*</span>
                        </label>

                        <input type="email" id="email" name="email" placeholder="example@gmail.com">

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                            <span class="required">*</span>
                        </label>

                        <input type="password" id="password" name="password" placeholder="Enter password">

                    </div>


                    <!-- Age -->

                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input type="number" id="age" name="age" placeholder="Enter your age" min="10" max="100">

                    </div>


                    <!-- DOB -->

                    <div class="form-group">

                        <label for="dob">
                            Date of Birth
                        </label>

                        <input type="date" id="dob" name="dob">

                    </div>


                    <!-- Gender -->

                    <div class="form-group">

                        <label>
                            Gender
                        </label>

                        <div class="radio-group">

                            <div class="radio-option">

                                <input type="radio" id="male" name="gender" value="Male">

                                <label for="male">
                                    Male
                                </label>

                            </div>


                            <div class="radio-option">

                                <input type="radio" id="female" name="gender" value="Female">

                                <label for="female">
                                    Female
                                </label>

                            </div>


                            <div class="radio-option">

                                <input type="radio" id="other" name="gender" value="Other">

                                <label for="other">
                                    Other
                                </label>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Education -->

            <div class="section">

                <h2 class="section-title">
                    🎓 Education & Skills
                </h2>

                <div class="form-grid">

                    <!-- Course -->

                    <div class="form-group">

                        <label for="course">
                            Select Course
                            <span class="required">*</span>
                        </label>

                        <select id="course" name="course">

                            <option value="">
                                -- Select Course --
                            </option>

                            <option value="Web Development">
                                Web Development
                            </option>

                            <option value="Python">
                                Python Programming
                            </option>

                            <option value="MERN Stack">
                                MERN Stack
                            </option>

                            <option value="Data Analytics">
                                Data Analytics
                            </option>

                            <option value="AI">
                                Artificial Intelligence
                            </option>

                        </select>

                    </div>


                    <!-- Qualification -->

                    <div class="form-group">

                        <label for="qualification">
                            Qualification
                        </label>

                        <select id="qualification" name="qualification">

                            <option value="">
                                -- Select Qualification --
                            </option>

                            <option value="10th">
                                10th
                            </option>

                            <option value="12th">
                                12th
                            </option>

                            <option value="Graduation">
                                Graduation
                            </option>

                            <option value="Post Graduation">
                                Post Graduation
                            </option>

                        </select>

                    </div>


                    <!-- Skills -->

                    <div class="form-group full">

                        <label>
                            Technical Skills
                        </label>

                        <div class="checkbox-group">

                            <div class="checkbox-option">

                                <input type="checkbox" id="html" name="skills" value="HTML">

                                <label for="html">
                                    HTML
                                </label>

                            </div>


                            <div class="checkbox-option">

                                <input type="checkbox" id="css" name="skills" value="CSS">

                                <label for="css">
                                    CSS
                                </label>

                            </div>


                            <div class="checkbox-option">

                                <input type="checkbox" id="javascript" name="skills" value="JavaScript">

                                <label for="javascript">
                                    JavaScript
                                </label>

                            </div>


                            <div class="checkbox-option">

                                <input type="checkbox" id="python" name="skills" value="Python">

                                <label for="python">
                                    Python
                                </label>

                            </div>


                            <div class="checkbox-option">

                                <input type="checkbox" id="react" name="skills" value="React">

                                <label for="react">
                                    React
                                </label>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Address -->

            <div class="section">

                <h2 class="section-title">
                    📍 Contact Information
                </h2>

                <div class="form-grid">

                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number">

                    </div>


                    <!-- City -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input type="text" id="city" name="city" placeholder="Enter your city">

                    </div>


                    <!-- Address -->

                    <div class="form-group full">

                        <label for="address">
                            Address
                        </label>

                        <textarea id="address" name="address" placeholder="Enter your complete address"></textarea>

                    </div>

                </div>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button type="reset" class="reset-btn">
                    Reset
                </button>

                <button type="submit" class="submit-btn">
                    Submit Registration
                </button>

            </div>

        </form>


        <!-- Footer -->

        <div class="form-footer">

            © 2026 Student Registration Portal |
            All Rights Reserved

        </div>

    </div>

</body>

</html>
